name: 🐞 Bug report
description: Something isn't working as expected · Algo no funciona como debería
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Issues in English or Spanish are welcome. · Puedes escribir en inglés o en español."
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you did, what you expected and what happened.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How does Ollama start on your Mac?
      options:
        - Ollama.app (the official app)
        - brew services
        - Custom LaunchAgent
        - Manual ollama serve
        - I don't know
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ModelNap version
      placeholder: "1.2.1"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and chip
      placeholder: "macOS 26.6, Apple M4 / Intel"
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Output of --status
      description: 'Run `/Applications/ModelNap.app/Contents/MacOS/ModelNap --status` and paste the result.'
      render: text
