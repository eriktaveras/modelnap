name: ✨ Feature idea
description: Suggest an improvement · Propón una mejora
labels: [idea]
body:
  - type: markdown
    attributes:
      value: "Ideas in English or Spanish are welcome. · Puedes escribir en inglés o en español."
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How do you imagine it?
